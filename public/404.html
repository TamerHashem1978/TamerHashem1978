<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - الصفحة غير موجودة | سبق Sabaq</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold-primary: #F9AD10;
      --gold-shadow: #8A4B06;
      --green-card: #05311C;
      --green-section: #052316;
      --bg-color: #070B07;
      --text-primary: #D5E5D2;
      --text-secondary: #8DA18F;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: var(--green-card);
      border: 1px solid rgba(249, 173, 16, 0.4);
      border-radius: 24px;
      padding: 48px 32px;
      max-width: 500px;
      width: 100%;
    }
    h1 {
      font-family: 'Aref Ruqaa', serif;
      font-size: 72px;
      color: var(--gold-primary);
      margin-bottom: 8px;
    }
    h2 {
      font-family: 'Aref Ruqaa', serif;
      font-size: 28px;
      color: var(--text-primary);
      margin-bottom: 16px;
    }
    p {
      color: var(--text-secondary);
      margin-bottom: 28px;
      font-size: 16px;
      line-height: 1.6;
    }
    a {
      display: inline-block;
      padding: 12px 28px;
      background: linear-gradient(135deg, var(--gold-shadow), var(--gold-primary));
      color: var(--bg-color);
      font-family: 'Aref Ruqaa', serif;
      font-size: 17px;
      font-weight: bold;
      text-decoration: none;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>٤٠٤</h1>
    <h2>الصفحة غير موجودة</h2>
    <p>يبدو أن الرابط الذي تبحث عنه غير متاح أو تم نقله في منصة سبق.</p>
    <a href="/">العودة إلى الرئيسية (gosabaq.com)</a>
  </div>
</body>
</html>
